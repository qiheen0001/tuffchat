<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random Cat</title>

<style>
  body {
    text-align: center;
    color: white
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: transparent;
  }

  img {
    max-width: 100%;
    border-radius: 18px;
    margin-top: 14px;
  }

  /* Glass container border */
  .glass-box {
    display: inline-block;
    padding: 20px 26px 26px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.35);
    box-shadow:
      0 10px 30px rgba(0, 0, 0, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }

  /* Liquid glass button */
  button {
    margin-top: 16px;
    padding: 12px 26px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.45);
    background: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.45),
      rgba(255, 255, 255, 0.15)
    );
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #111;
    cursor: pointer;
    box-shadow:
      0 8px 20px rgba(0, 0, 0, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover {
    transform: translateY(-1px);
    box-shadow:
      0 10px 24px rgba(0, 0, 0, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }

  button:active {
    transform: scale(0.97);
    box-shadow:
      0 6px 14px rgba(0, 0, 0, 0.25),
      inset 0 2px 6px rgba(0, 0, 0, 0.2);
  }
</style>
</head>

<body>

<div class="glass-box">
  <h2>Random Cat 🐱</h2>
  <img id="catImage" alt="Random cat">
  <br>
  <button onclick="loadCat()">cat!!</button>
</div>

<script>
const API_KEY = "54553009-e71e79a756dea1d8ef125ebd3";

async function loadCat() {
  const response = await fetch(
    `https://pixabay.com/api/?key=${API_KEY}&q=cat&image_type=photo&per_page=200`
  );
  const data = await response.json();

  if (!data.hits || data.hits.length === 0) return;

  const randomIndex = Math.floor(Math.random() * data.hits.length);
  document.getElementById("catImage").src =
    data.hits[randomIndex].webformatURL;
}

// Load on refresh
loadCat();
</script>

</body>
</html>
