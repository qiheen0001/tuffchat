<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>tuff chat</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #222;
      color: white;
    }

    /* Name overlay */
    #nameOverlay {
      position: fixed;
      inset: 0;
      background: #222;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #nameOverlay input,
    #nameOverlay button {
      padding: 10px;
      font-size: 18px;
      margin-top: 10px;
      width: 250px;
      border: 2px solid #333;
      border-radius: 10px;
    }

    /* Chat */
    #chatContainer {
      display: none;
      padding: 20px;
    }

    #messages {
      list-style: none;
      padding: 10px;
      max-height: 65vh;
      overflow-y: auto;
      /* Needed so floated children are contained */
      overflow-x: hidden;
    }

    /* Clearfix for floated messages */
    #messages::after {
      content: "";
      display: table;
      clear: both;
    }

    #messages li {
      display: inline-block;
      clear: both;
      padding: 10px 15px;
      margin: 6px 0;
      border-radius: 20px;
      max-width: 70%;
      word-wrap: break-word;

      /* Animation base state */
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      animation: messageIn 0.35s cubic-bezier(0.34, 1.45, 0.64, 1) forwards;
    }

    /* Self messages slide in from the right */
    .self {
      background: #25D366;
      float: right;
      text-align: right;
      transform-origin: right bottom;
      animation-name: messageInRight !important;
    }

    /* Other messages slide in from the left */
    .other {
      background: #333;
      float: left;
      text-align: left;
      transform-origin: left bottom;
      animation-name: messageInLeft !important;
    }

    @keyframes messageInRight {
      0% {
        opacity: 0;
        transform: translateX(28px) translateY(8px) scale(0.93);
      }
      100% {
        opacity: 1;
        transform: translateX(0) translateY(0) scale(1);
      }
    }

    @keyframes messageInLeft {
      0% {
        opacity: 0;
        transform: translateX(-28px) translateY(8px) scale(0.93);
      }
      100% {
        opacity: 1;
        transform: translateX(0) translateY(0) scale(1);
      }
    }

    /* Stagger animation for messages already in the list on load */
    #messages li:nth-child(1)  { animation-delay: 0.00s; }
    #messages li:nth-child(2)  { animation-delay: 0.04s; }
    #messages li:nth-child(3)  { animation-delay: 0.08s; }
    #messages li:nth-child(4)  { animation-delay: 0.12s; }
    #messages li:nth-child(5)  { animation-delay: 0.16s; }
    #messages li:nth-child(6)  { animation-delay: 0.20s; }
    #messages li:nth-child(7)  { animation-delay: 0.24s; }
    #messages li:nth-child(8)  { animation-delay: 0.28s; }
    #messages li:nth-child(9)  { animation-delay: 0.32s; }
    #messages li:nth-child(10) { animation-delay: 0.36s; }

    .message-name {
      font-weight: bold;
      font-size: 0.9em;
      display: block;
      margin-bottom: 3px;
    }

    .message-time {
      font-size: 0.75em;
      opacity: 0.7;
      display: block;
      margin-top: 4px;
    }

    #msg {
      width: 78%;
      padding: 10px;
      font-size: 16px;
      border-radius: 10px;
      border: 2px solid #333;
    }

    #sendBtn {
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 2px solid #333;
      cursor: pointer;
    }

    /* Draggable music container */
    #draggableMusic {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 3000;
      cursor: move;
    }
  </style>
</head>

<body>

  <div id="nameOverlay">
    <h1>Enter your name</h1>
    <input id="nameInput" placeholder="Your name">
    <button id="enterBtn">Enter chat</button>
  </div>

  <div id="chatContainer">
    <ul id="messages"></ul>
    <input id="msg" placeholder="Type a message">
    <button id="sendBtn">Send</button>
  </div>

  <!-- Draggable Elfsight Music -->
  <div id="draggableMusic">
    <script src="https://elfsightcdn.com/platform.js" async></script>
    <div class="elfsight-app-fc7ab89c-0207-4fbf-85c1-9727b239afd1"></div>
  </div>

  <!-- Firebase + Chat -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcrwcppQSIkY2W9uF2oX61WsiLD4fd53I",
      authDomain: "tuffchat-9bed7.firebaseapp.com",
      projectId: "tuffchat-9bed7",
      storageBucket: "tuffchat-9bed7.firebasestorage.app",
      messagingSenderId: "1024456330904",
      appId: "1:1024456330904:web:827d34d04d230f02630aed"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const messagesRef = collection(db, "messages");
    const q = query(messagesRef, orderBy("time"));

    const nameOverlay = document.getElementById("nameOverlay");
    const nameInput = document.getElementById("nameInput");
    const enterBtn = document.getElementById("enterBtn");
    const chatContainer = document.getElementById("chatContainer");
    const messagesList = document.getElementById("messages");
    const msgInput = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");

    let userId = sessionStorage.getItem("userId");
    if (!userId) {
      userId = crypto.randomUUID();
      sessionStorage.setItem("userId", userId);
    }

    let username = sessionStorage.getItem("username") || "";

    function enterChat() {
      const name = nameInput.value.trim();
      if (!name) return alert("Please enter a name");
      username = name;
      sessionStorage.setItem("username", username);
      nameOverlay.style.display = "none";
      chatContainer.style.display = "block";
    }

    if (username) {
      nameOverlay.style.display = "none";
      chatContainer.style.display = "block";
    }

    enterBtn.onclick = enterChat;
    nameInput.onkeypress = e => {
      if (e.key === "Enter") enterChat();
    };

    sendBtn.onclick = async () => {
      if (!msgInput.value.trim()) return;
      await addDoc(messagesRef, {
        text: msgInput.value,
        name: username,
        userId: userId,
        time: Date.now()
      });
      msgInput.value = "";
    };

    msgInput.onkeypress = e => {
      if (e.key === "Enter") sendBtn.click();
    };

    // Track known message IDs to detect truly new messages vs initial load
    let knownIds = new Set();
    let initialLoad = true;

    onSnapshot(q, snapshot => {
      // On initial load, render all at once with stagger via CSS nth-child
      if (initialLoad) {
        messagesList.innerHTML = "";
        snapshot.forEach(doc => {
          knownIds.add(doc.id);
          const li = buildMessageEl(doc.data());
          messagesList.appendChild(li);
        });
        messagesList.scrollTop = messagesList.scrollHeight;
        initialLoad = false;
        return;
      }

      // After initial load, only append genuinely new messages
      snapshot.docChanges().forEach(change => {
        if (change.type === "added" && !knownIds.has(change.doc.id)) {
          knownIds.add(change.doc.id);
          const li = buildMessageEl(change.doc.data());

          // Force a fresh animation regardless of nth-child stagger delays
          li.style.animationDelay = "0s";

          messagesList.appendChild(li);
          messagesList.scrollTop = messagesList.scrollHeight;
        }
      });
    });

    function buildMessageEl(data) {
      const li = document.createElement("li");
      li.className = data.userId === userId ? "self" : "other";

      const date = new Date(data.time);
      const hours = date.getHours() % 12 || 12;
      const minutes = String(date.getMinutes()).padStart(2, "0");
      const ampm = date.getHours() >= 12 ? "PM" : "AM";

      li.innerHTML = `
        <span class="message-name">${data.name}</span>
        ${data.text}
        <span class="message-time">${hours}:${minutes} ${ampm}</span>
      `;

      return li;
    }
  </script>

  <!-- Drag Script -->
  <script>
    const dragItem = document.getElementById("draggableMusic");
    let offsetX = 0, offsetY = 0, isDragging = false;

    dragItem.addEventListener("mousedown", (e) => {
      isDragging = true;
      offsetX = e.clientX - dragItem.offsetLeft;
      offsetY = e.clientY - dragItem.offsetTop;
      dragItem.style.bottom = "auto";
      dragItem.style.right = "auto";
    });

    document.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      dragItem.style.left = e.clientX - offsetX + "px";
      dragItem.style.top = e.clientY - offsetY + "px";
    });

    document.addEventListener("mouseup", () => {
      isDragging = false;
    });
  </script>

</body>
</html>
