<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>tuff chat</title>

  <style>
    htmlbody, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #222;
      color: white;
    }

    /* Name overlay */
    #nameOverlay {
      position: fixed;
      inset: 0;
      background: #222;
      display: flex;
      flex-direction: column;
      justify-content: centre;
      align-items: centre;
      z-index: 1000;
    }

    #nameOverlay input,
    #nameOverlay button {
      padding: 10px;
      font-size: 18px;
      margin-top: 10px;
      width: 250px;
      border: 2px solid #333;
      border-radius: 10px;
    }

    /* Chat */
    #chatContainer {
      display: none;
      padding: 20px;
    }

    #messages {
      list-style: none;
      padding: 10px;
      max-height: 65vh;
      overflow-y: auto;
    }

    #messages li {
      display: inline-block;
      clear: both;
      padding: 10px 15px;
      margin: 6px 0;
      border-radius: 20px;
      max-width: 70%;
      word-wrap: break-word;
    }

    .self {
      background: #25D366;
      float: right;
      text-align: right;
    }

    .other {
      background: #333;
      float: left;
      text-align: left;
    }

    .message-name {
      font-weight: bold;
      font-size: 0.9em;
      display: block;
      margin-bottom: 3px;
    }

    .message-time {
      font-size: 0.75em;
      opacity: 0.7;
      display: block;
      margin-top: 4px;
    }

    #msg {
      width: 78%;
      padding: 10px;
      font-size: 16px;
      border-radius: 10px;
      border: 2px solid #333;
    }

    #sendBtn {
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 2px solid #333;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- Name entry -->
  <div id="nameOverlay">
    <h1>Enter your name</h1>
    <input id="nameInput" placeholder="Your name">
    <button id="enterBtn">Enter chat</button>
  </div>

  <!-- Chat -->
  <div id="chatContainer">
    <ul id="messages"></ul>
    <input id="msg" placeholder="Type a message">
    <button id="sendBtn">Send</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcrwcppQSIkY2W9uF2oX61WsiLD4fd53I",
      authDomain: "tuffchat-9bed7.firebaseapp.com",
      projectId: "tuffchat-9bed7",
      storageBucket: "tuffchat-9bed7.firebasestorage.app",
      messagingSenderId: "1024456330904",
      appId: "1:1024456330904:web:827d34d04d230f02630aed"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const messagesRef = collection(db, "messages");
    const q = query(messagesRef, orderBy("time"));

    const nameOverlay = document.getElementById("nameOverlay");
    const nameInput = document.getElementById("nameInput");
    const enterBtn = document.getElementById("enterBtn");

    const chatContainer = document.getElementById("chatContainer");
    const messagesList = document.getElementById("messages");
    const msgInput = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");

    /* UNIQUE USER ID (fixes the bug) */
    let userId = sessionStorage.getItem("userId");
    if (!userId) {
      userId = crypto.randomUUID();
      sessionStorage.setItem("userId", userId);
    }

    let username = sessionStorage.getItem("username") || "";

    function enterChat() {
      const name = nameInput.value.trim();
      if (!name) {
        alert("Please enter a name");
        return;
      }

      username = name;
      sessionStorage.setItem("username", username);
      nameOverlay.style.display = "none";
      chatContainer.style.display = "block";
    }

    if (username) {
      nameOverlay.style.display = "none";
      chatContainer.style.display = "block";
    }

    enterBtn.onclick = enterChat;
    nameInput.onkeypress = e => {
      if (e.key === "Enter") enterChat();
    };

    sendBtn.onclick = async () => {
      if (!msgInput.value.trim()) return;

      await addDoc(messagesRef, {
        text: msgInput.value,
        name: username,
        userId: userId,
        time: Date.now()
      });

      msgInput.value = "";
    };

    msgInput.onkeypress = e => {
      if (e.key === "Enter") sendBtn.click();
    };

    onSnapshot(q, snapshot => {
      messagesList.innerHTML = "";

      snapshot.forEach(doc => {
        const data = doc.data();
        const li = document.createElement("li");

        li.className = data.userId === userId ? "self" : "other";

        const date = new Date(data.time);
        const hours = date.getHours() % 12 || 12;
        const minutes = String(date.getMinutes()).padStart(2, "0");
        const ampm = date.getHours() >= 12 ? "PM" : "AM";

        li.innerHTML = `
          <span class="message-name">${data.name}</span>
          ${data.text}
          <span class="message-time">${hours}:${minutes} ${ampm}</span>
        `;

        messagesList.appendChild(li);
      });

      messagesList.scrollTo({
        top: messagesList.scrollHeight,
        behaviour: "smooth"
      });
    });
  </script>

</body>
</html>
